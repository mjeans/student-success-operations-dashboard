<text x="1040.0" y="914.0" font-size="18" class="muted" text-anchor="start">Do not subtract the separate baseline and</text>
<text x="1040.0" y="942.0" font-size="18" class="muted" text-anchor="start">follow-up averages: their observed samples</text>
<text x="1040.0" y="970.0" font-size="18" class="muted" text-anchor="start">can differ. Use paired change.</text>
